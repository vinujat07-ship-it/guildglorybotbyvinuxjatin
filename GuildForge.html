<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuildForge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&display=swap">
<style>
:root{--bg:#0d0d12;--card:#16161d;--bd:#262631;--tx:#f4f4f7;--mu:#8b8b99;--pu:#7c3aed;--gr:#22c55e;--rd:#ef4444;--yl:#eab308;--bl:#3b82f6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{background:var(--bg);color:var(--tx);min-height:100%}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:20px}
h1{font-size:28px}h2{font-size:20px;margin:24px 0 12px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-top:14px}
.big{font-size:34px;font-weight:700;margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--pu);color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.o{background:transparent;border:1px solid var(--bd)}
.btn.full{width:100%;padding:14px}
.btn:disabled{opacity:.5}
input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--tx);padding:12px;font-size:15px;margin:6px 0 4px}
label{font-weight:600;font-size:14px;display:block;margin-top:12px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;margin-top:14px}
.tabs button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:7px;font-weight:600;cursor:pointer}
.tabs .on{background:var(--bg);color:var(--tx)}
.badge{background:var(--pu);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.promo{background:#0f2418;border:1px solid #1d4a2e;color:var(--gr);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:14px}
.promo b{background:var(--gr);color:#fff;border-radius:20px;padding:2px 9px;margin-right:8px;font-size:12px}
.empty{text-align:center;padding:30px 10px}
.empty .ic{font-size:44px;opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav .on{color:var(--pu)}
.qty{display:flex;gap:8px;align-items:center}.qty input{text-align:center;margin:0}
.sum{background:#1d1d27;border-radius:10px;padding:16px;margin:16px 0}
.sum .row{margin-bottom:6px}.g{color:var(--gr)}.s{text-decoration:line-through;color:var(--mu)}
.auth{max-width:420px;margin:12vh auto 0;padding:24px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.logo{text-align:center;font-weight:700;font-size:20px;background:linear-gradient(90deg,#a855f7,#60a5fa);-webkit-background-clip:text;color:transparent}
.auth .btn{background:linear-gradient(90deg,#9333ea,#2563eb);margin-top:18px}
.err{color:var(--rd);font-size:13px;margin-top:8px;min-height:16px}
a{color:var(--pu);cursor:pointer}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pu);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:9}
.test{text-align:center;margin-top:36px;padding:18px 10px;border-top:1px dashed var(--bd)}.test small{color:var(--yl);font-size:12px;letter-spacing:1px}.test h3{font-family:Orbitron,Impact,sans-serif;font-weight:800;font-size:30px;letter-spacing:2px;margin-top:10px;background:linear-gradient(90deg,#f472b6,#a855f7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(168,85,247,.5))}.code{font-family:monospace;letter-spacing:1px;font-weight:700}
</style></head>
<body><div id="app"></div>
<script>
const P=150,LIST=200;
let mem={};
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let users=st.get('gf_users',{}),me=st.get('gf_me',null),page='home',tab='redeem',mode='login',qty=1,err='',toastMsg='';
const $=s=>document.getElementById(s);
const U=()=>users[me];
const save=()=>{st.set('gf_users',users);st.set('gf_me',me)};
const hist=(t)=>{U().hist.unshift({t,d:new Date().toLocaleString()})};
function toast(m){toastMsg=m;draw();setTimeout(()=>{toastMsg='';draw()},2200)}
function auth(){
 const g=id=>($(id)||{}).value||'';
 const u=g('u').trim(),p=g('p');
 if(mode==='reg'){
  const e=g('e').trim(),c=g('c');
  if(!/^[a-z0-9_]{3,}$/.test(u))return setErr('Username: lowercase letters, numbers, underscore, min 3.');
  if(!/\S+@\S+\.\S+/.test(e))return setErr('Enter a valid email.');
  if(p.length<6)return setErr('Password must be at least 6 characters.');
  if(p!==c)return setErr('Passwords do not match.');
  if(users[u])return setErr('Username already taken.');
  users[u]={email:e,pw:p,basic:0,prem:0,groups:[],hist:[],joined:new Date().toLocaleDateString(),notes:1};
 }else if(!users[u]||users[u].pw!==p)return setErr('Invalid username or password.');
 me=u;err='';page='home';save();draw();
}
function setErr(m){err=m;draw()}
function buy(){const n=qty;U().basic+=n;hist('Bought '+n+' basic token(s) for Rs.'+n*P);save();qty=1;toast('Payment successful (demo). Tokens added!')}
function newGroup(){
 if(U().basic<1){toast('You need 1 basic token. Buy tokens first.');page='tokens';draw();return}
 const n=prompt('Group name?');if(!n||!n.trim())return;
 U().basic--;U().groups.unshift({n:n.trim(),on:true,d:new Date().toLocaleDateString()});
 hist('Created group "'+n.trim()+'"');save();toast('Group created');
}
function toggleG(i){const g=U().groups[i];g.on=!g.on;save();draw()}
function delG(i){U().groups.splice(i,1);save();draw()}
function mkCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s=[];for(let i=0;i<3;i++){let x='';for(let j=0;j<4;j++)x+=a[Math.floor(Math.random()*8*4)%a.length];s.push(x)}return s.join('-')}
function createCoupon(){
 const n=parseInt($('cn').value)||0;
 if(n<1)return toast('Enter at least 1 token');
 if(U().basic<n)return toast('Not enough basic tokens');
 U().basic-=n;const cs=st.get('gf_coupons',{});const c=mkCode();
 cs[c]={n,by:me,used:null};st.set('gf_coupons',cs);
 hist('Created coupon '+c+' ('+n+' tokens)');save();
 if(navigator.clipboard)navigator.clipboard.writeText(c).catch(()=>{});
 toast('Coupon '+c+' created');
}
function redeem(){
 const c=($('cc').value||'').trim().toUpperCase();const cs=st.get('gf_coupons',{});const k=cs[c];
 if(!k)return toast('Invalid coupon code');
 if(k.used)return toast('Coupon already used');
 if(k.by===me)return toast("You can't redeem your own coupon");
 k.used=me;U().basic+=k.n;st.set('gf_coupons',cs);
 hist('Redeemed '+c+' (+'+k.n+' tokens)');save();toast('+'+k.n+' tokens added');
}
function save2(){
 const e=$('pe').value.trim(),p=$('pp').value;
 if(!/\S+@\S+\.\S+/.test(e))return toast('Invalid email');
 if(p&&p.length<6)return toast('Password min 6 characters');
 U().email=e;if(p)U().pw=p;save();toast('Profile saved');
}
function logout(){me=null;save();draw()}
const nav=(p)=>{page=p;draw();scrollTo(0,0)};
function authView(){
 const r=mode==='reg';
 return `<div class="auth"><div class="logo">🛡️ GuildForge</div>
 <h2 style="text-align:center;margin:14px 0 2px">${r?'Create Account':'Welcome Back'}</h2>
 <p class="mu" style="text-align:center">${r?'Register to start gaining glory':'Login to your dashboard'}</p>
 <label>Username</label><input id="u" placeholder="e.g. john_doe" autocapitalize="none">
 ${r?'<label>Email</label><input id="e" type="email" placeholder="your@email.com">':''}
 <label>Password</label><input id="p" type="password" placeholder="Min 6 characters">
 ${r?'<label>Confirm Password</label><input id="c" type="password" placeholder="Confirm your password">':''}
 <div class="err">${err}</div>
 <button class="btn full" onclick="auth()">${r?'Register':'Login'}</button>
 <p class="mu" style="text-align:center;margin-top:16px">${r?'Already have an account?':'New here?'} <a onclick="mode='${r?'login':'reg'}';err='';draw()">${r?'Login':'Register'}</a></p></div>`;
}
function home(){
 const u=U(),a=u.groups.filter(g=>g.on).length;
 return `<h1>Welcome, ${me}!</h1><p class="mu">Here's your account overview</p>
 <div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn o" onclick="draw()">⟳ Refresh</button><button class="btn" onclick="newGroup()">+ New Group</button></div>
 <div class="card"><span class="mu">Basic Tokens</span><div class="big">${u.basic}</div><span class="mu">Rs.${P}/token</span></div>
 <div class="card"><span class="mu">Active Groups</span><div class="big">${a}</div><span class="mu">of ${u.groups.length} total</span></div>
 <div class="card"><span class="mu">Notifications</span><div class="big">${u.notes}</div><span class="mu">unread</span></div>
 <div class="card row" onclick="alert('Tutorial coming soon!')"><div style="font-size:26px">▶️</div><div style="flex:1"><b>Watch Tutorial</b><div class="mu">Learn how to set up and use GuildForge in minutes</div></div></div>
 <div class="row"><h2>Active Groups</h2><a onclick="nav('groups')" style="color:var(--tx);font-size:14px">View All</a></div>
 ${gList(u.groups.filter(g=>g.on))}
 <div class="test"><small>⚠️ THIS WEBSITE IS FOR TESTING ONLY</small><h3>VINAY X JATIN</h3></div>`;
}
function gList(l){
 if(!l.length)return `<div class="card empty"><div class="ic">🏆</div><b>No active groups</b><p class="mu" style="margin:6px 0 14px">Start gaining glory for your guild</p><button class="btn" onclick="newGroup()">Create Group</button></div>`;
 return l.map(g=>{const i=U().groups.indexOf(g);return `<div class="card row"><div><b>${g.n.replace(/</g,'&lt;')}</b><div class="mu">${g.d} · ${g.on?'<span class="g">running</span>':'paused'}</div></div><div><button class="btn o" onclick="toggleG(${i})">${g.on?'Pause':'Start'}</button> <button class="btn o" onclick="delG(${i})">🗑</button></div></div>`}).join('');
}
function groups(){
 const u=U();
 return `<h1>My Groups</h1><p class="mu">${u.groups.filter(g=>g.on).length} running</p>
 <div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn o" onclick="draw()">⟳ Refresh</button><button class="btn" onclick="newGroup()">+ New Group</button></div>
 ${u.groups.length?gList(u.groups):'<div class="card empty"><p class="mu" style="margin-bottom:14px">No groups yet</p><button class="btn" onclick="newGroup()">Create Your First Group</button></div>'}`;
}
function tokens(){
 const tot=qty*LIST,pay=qty*P;
 return `<div class="row"><h1>Tokens</h1><button class="btn o" onclick="draw()">⟳ Refresh</button></div>
 <div class="promo"><b>25% OFF</b>new — Basic tokens discounted</div>
 <div class="card"><span>Basic Tokens</span><div class="big">${U().basic}</div><span class="s">Rs.${LIST}</span> <b class="g">Rs.${P}</b> <span class="mu">per token</span></div>
 <div class="card"><b style="font-size:18px">Buy Tokens</b>
 <p style="margin:18px 0 8px;font-weight:600">Basic Tokens (<span class="s">Rs.${LIST}</span> <span class="g">Rs.${P}</span> each)</p>
 <div class="qty"><button class="btn o" onclick="qty=Math.max(1,qty-1);draw()">−</button><input type="number" min="1" value="${qty}" onchange="qty=Math.max(1,parseInt(this.value)||1);draw()"><button class="btn o" onclick="qty++;draw()">+</button></div>
 <div class="sum"><div class="row mu"><span>Subtotal</span><span class="s">Rs.${tot}</span></div>
 <div class="row g"><span>Discount (25% off · new)</span><span>- Rs.${tot-pay}</span></div>
 <div class="row" style="margin:10px 0"><b style="font-size:20px">Total</b><b style="font-size:18px">Rs.${pay}</b></div>
 <div class="mu">${qty} basic + 0 premium tokens · <span class="g">You save Rs.${tot-pay}</span></div></div>
 <button class="btn full" onclick="buy()">💳 Pay Rs.${pay}</button>
 <p class="mu" style="text-align:center;margin-top:14px;font-size:12px">Demo checkout: no real payment is taken. Connect a payment gateway (UPI, cards, wallets, net-banking) to go live.</p></div>`;
}
function coupons(){
 const cs=st.get('gf_coupons',{});
 let body='';
 if(tab==='redeem'){
  const mine=Object.entries(cs).filter(([c,k])=>k.used===me);
  body=`<div class="card"><b>⬇ Redeem a Coupon</b><div class="row" style="margin-top:12px"><input id="cc" placeholder="XXXX-XXXX-XXXX" style="margin:0"><button class="btn" onclick="redeem()">Redeem</button></div></div>
  <h2>Redeemed Coupons</h2>${mine.length?mine.map(([c,k])=>`<div class="card row"><span class="code">${c}</span><span class="g">+${k.n}</span></div>`).join(''):'<div class="card empty mu">No coupons redeemed yet</div>'}`;
 }else if(tab==='create'){
  const my=Object.entries(cs).filter(([c,k])=>k.by===me);
  body=`<div class="card"><b>Create a Coupon</b><p class="mu" style="margin-top:6px">Spend your basic tokens to make a code a friend can redeem.</p><label>Tokens in coupon</label><input id="cn" type="number" min="1" value="1"><button class="btn full" style="margin-top:10px" onclick="createCoupon()">Create &amp; Copy</button></div>
  <h2>Your Coupons</h2>${my.length?my.map(([c,k])=>`<div class="card row"><div><span class="code">${c}</span><div class="mu">${k.n} token(s) · ${k.used?'redeemed by '+k.used:'unused'}</div></div><button class="btn o" onclick="navigator.share?navigator.share({text:'Redeem code ${c} on GuildForge'}):navigator.clipboard.writeText('${c}');">Share</button></div>`).join(''):'<div class="card empty mu">Nothing created yet</div>'}`;
 }else{
  const h=U().hist;
  body=h.length?h.map(x=>`<div class="card"><b>${x.t.replace(/</g,'&lt;')}</b><div class="mu">${x.d}</div></div>`).join(''):'<div class="card empty mu">No activity yet</div>';
 }
 return `<h1>Coupons</h1><div class="tabs">${[['redeem','Redeem'],['create','Create & Share'],['hist','History']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('')}</div>${body}`;
}
function profile(){
 const u=U();
 return `<h1>Profile</h1><div class="card"><b>👤 Account Info</b>
 <div class="row" style="margin-top:14px"><span class="mu">Username</span><b>${me}</b></div>
 <div class="row" style="margin-top:12px"><span class="mu">Role</span><span class="badge">user</span></div>
 <div class="row" style="margin-top:12px"><span class="mu">Status</span><span class="g">Active</span></div>
 <div class="row" style="margin-top:12px"><span class="mu">Basic Tokens</span><b>${u.basic}</b></div>
 <div class="row" style="margin-top:12px"><span class="mu">Premium Tokens</span><b>${u.prem}</b></div>
 <div class="row" style="margin-top:12px"><span class="mu">Joined</span><b>${u.joined}</b></div></div>
 <div class="card"><b>Edit Profile</b><label>Email</label><input id="pe" type="email" value="${u.email}">
 <label>New Password (leave empty to keep current)</label><input id="pp" type="password" placeholder="Min 6 characters">
 <button class="btn" style="margin-top:10px" onclick="save2()">Save Changes</button></div>
 <button class="btn o full" style="margin-top:16px" onclick="logout()">Log out</button>`;
}
function draw(){
 const keep=document.activeElement&&document.activeElement.id;
 let h='';
 if(!me||!users[me]){h=authView()}
 else{
  const v={home,groups,tokens,coupons,profile}[page]();
  const items=[['home','▦','Home'],['groups','👥','Groups'],['tokens','💳','Tokens'],['coupons','🎟','Coupons'],['profile','👤','Profile']];
  h=`<div class="wrap">${v}</div><nav>${items.map(([k,i,l])=>`<button class="${page===k?'on':''}" onclick="nav('${k}')"><span>${i}</span>${l}</button>`).join('')}</nav>`;
 }
 if(toastMsg)h+=`<div class="toast">${toastMsg}</div>`;
 $('app').innerHTML=h;
}
draw();
</script></body></html>
